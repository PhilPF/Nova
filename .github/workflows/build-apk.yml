name: Build APK

# Runs from the Actions tab ("Build APK" > "Run workflow"), and on pushes to Claude's
# development branches so every change there is compiled and tested.
on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"

permissions:
  contents: write # needed to update the debug-build release below

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Nova.apk

      - name: Keep the APK for the screenshots job
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Nova.apk
          if-no-files-found: error

      # The raw .apk on a rolling "debug-build" release, so it installs straight from a phone
      # browser (workflow artifacts are always zipped).
      - name: Publish to the debug-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Debug build of \`${{ github.sha }}\` ($(date -u +%Y-%m-%d\ %H:%M) UTC). Download Nova.apk and open it on your phone (allow installs from this source if asked). Requires Android 12 or newer."
          if gh release view debug-build --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload debug-build Nova.apk --repo "${{ github.repository }}" --clobber
            gh release edit debug-build --repo "${{ github.repository }}" --notes "$NOTES"
          else
            gh release create debug-build Nova.apk \
              --repo "${{ github.repository }}" \
              --title "Debug build (latest)" \
              --notes "$NOTES" \
              --prerelease \
              --target "${{ github.sha }}"
          fi

  # Opens the app on an emulator with a generated sample library and adds screenshots to the release.
  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Make the sample library
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          bash .github/demo_media.sh demo

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash .github/screenshots.sh

      - name: Add screenshots to the debug-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload debug-build screenshots/*.png --repo "${{ github.repository }}" --clobber
